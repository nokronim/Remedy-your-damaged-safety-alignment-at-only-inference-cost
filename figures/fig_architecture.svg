<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 420">
  <style>
    text { font-family: 'Times New Roman', 'DejaVu Serif', serif; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; font-weight: 400; }
    .t  { font-size: 14px; font-weight: 400; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Backbone label above -->
  <text class="th" x="375" y="24" text-anchor="middle" fill="#633806">Frozen backbone (L layers, not modified)</text>

  <text class="t" x="44" y="62" text-anchor="start" fill="#854F0B">Input x</text>
  <line x1="84" y1="58" x2="108" y2="58" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Backbone band -->
  <rect x="110" y="36" width="530" height="46" rx="8" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.8"/>

  <rect x="122" y="46" width="30" height="26" rx="3" fill="#FAC775" stroke="#EF9F27" stroke-width="0.3"/>
  <rect x="158" y="46" width="30" height="26" rx="3" fill="#FAC775" stroke="#EF9F27" stroke-width="0.3"/>
  <rect x="194" y="46" width="30" height="26" rx="3" fill="#FAC775" stroke="#EF9F27" stroke-width="0.3"/>
  <rect x="230" y="46" width="30" height="26" rx="3" fill="#FAC775" stroke="#EF9F27" stroke-width="0.3"/>
  <rect x="266" y="46" width="30" height="26" rx="3" fill="#FAC775" stroke="#EF9F27" stroke-width="0.3"/>
  <rect x="302" y="46" width="30" height="26" rx="3" fill="#FAC775" stroke="#EF9F27" stroke-width="0.3"/>
  <rect x="338" y="46" width="30" height="26" rx="3" fill="#FAC775" stroke="#EF9F27" stroke-width="0.3"/>
  <rect x="374" y="46" width="30" height="26" rx="3" fill="#FAC775" stroke="#EF9F27" stroke-width="0.3"/>
  <rect x="410" y="46" width="30" height="26" rx="3" fill="#FAC775" stroke="#EF9F27" stroke-width="0.3"/>
  <rect x="446" y="46" width="30" height="26" rx="3" fill="#FAC775" stroke="#EF9F27" stroke-width="0.3"/>
  <rect x="482" y="46" width="30" height="26" rx="3" fill="#FAC775" stroke="#EF9F27" stroke-width="0.3"/>
  <rect x="518" y="46" width="30" height="26" rx="3" fill="#FAC775" stroke="#EF9F27" stroke-width="0.3"/>
  <rect x="554" y="46" width="30" height="26" rx="3" fill="#FAC775" stroke="#EF9F27" stroke-width="0.3"/>
  <rect x="590" y="46" width="30" height="26" rx="3" fill="#FAC775" stroke="#EF9F27" stroke-width="0.3"/>

  <line x1="640" y1="58" x2="660" y2="58" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Ladder connections -->
  <line x1="137" y1="72" x2="130" y2="148" stroke="#D4537E" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="209" y1="72" x2="172" y2="148" stroke="#D4537E" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="317" y1="72" x2="242" y2="148" stroke="#D4537E" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="425" y1="72" x2="312" y2="148" stroke="#D4537E" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="497" y1="72" x2="362" y2="148" stroke="#D4537E" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="569" y1="72" x2="412" y2="148" stroke="#D4537E" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- Side network band -->
  <rect x="110" y="150" width="340" height="40" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.8"/>

  <rect x="122" y="160" width="22" height="20" rx="3" fill="#B5D4F4" stroke="#85B7EB" stroke-width="0.3"/>
  <rect x="150" y="160" width="22" height="20" rx="3" fill="#B5D4F4" stroke="#85B7EB" stroke-width="0.3"/>
  <rect x="178" y="160" width="22" height="20" rx="3" fill="#B5D4F4" stroke="#85B7EB" stroke-width="0.3"/>
  <rect x="206" y="160" width="22" height="20" rx="3" fill="#B5D4F4" stroke="#85B7EB" stroke-width="0.3"/>
  <rect x="234" y="160" width="22" height="20" rx="3" fill="#B5D4F4" stroke="#85B7EB" stroke-width="0.3"/>
  <rect x="262" y="160" width="22" height="20" rx="3" fill="#B5D4F4" stroke="#85B7EB" stroke-width="0.3"/>
  <rect x="290" y="160" width="22" height="20" rx="3" fill="#B5D4F4" stroke="#85B7EB" stroke-width="0.3"/>
  <rect x="318" y="160" width="22" height="20" rx="3" fill="#B5D4F4" stroke="#85B7EB" stroke-width="0.3"/>
  <rect x="346" y="160" width="22" height="20" rx="3" fill="#B5D4F4" stroke="#85B7EB" stroke-width="0.3"/>
  <rect x="374" y="160" width="22" height="20" rx="3" fill="#B5D4F4" stroke="#85B7EB" stroke-width="0.3"/>
  <rect x="402" y="160" width="22" height="20" rx="3" fill="#B5D4F4" stroke="#85B7EB" stroke-width="0.3"/>

  <!-- Side network label -->
  <text class="th" x="466" y="164" text-anchor="start" fill="#0C447C">Side network</text>
  <text class="ts" x="466" y="182" text-anchor="start" fill="#185FA5">K layers, ~3% params</text>

  <!-- Gated fusion pill -->
  <rect x="530" y="106" width="96" height="26" rx="13" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text class="ts" x="578" y="121" text-anchor="middle" dominant-baseline="central" fill="#72243E">Gated fusion</text>

  <!-- Pool + MLP -->
  <line x1="280" y1="190" x2="280" y2="236" stroke="#185FA5" stroke-width="1" marker-end="url(#arrow)"/>
  <text class="ts" x="286" y="222" text-anchor="start" fill="#185FA5">Pool + MLP</text>

  <!-- Safety score -->
  <rect x="224" y="240" width="112" height="36" rx="8" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.8"/>
  <text class="th" x="280" y="261" text-anchor="middle" dominant-baseline="central" fill="#26215C">Safety score</text>

  <!-- Routing -->
  <path d="M252 276 Q224 302 206 312" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M308 276 Q336 302 354 312" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text class="ts" x="220" y="300" text-anchor="middle" fill="#085041">safe</text>
  <text class="ts" x="342" y="300" text-anchor="middle" fill="#791F1F">harmful</text>

  <rect x="140" y="316" width="120" height="30" rx="15" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th" x="200" y="333" text-anchor="middle" dominant-baseline="central" fill="#04342C">Pass through</text>

  <rect x="300" y="316" width="120" height="30" rx="15" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
  <text class="th" x="360" y="333" text-anchor="middle" dominant-baseline="central" fill="#501313">Refuse</text>

  <text class="ts" x="200" y="364" text-anchor="middle" fill="#085041">Base model output unchanged</text>
  <text class="ts" x="360" y="364" text-anchor="middle" fill="#791F1F">Safety head intervenes</text>
</svg>
