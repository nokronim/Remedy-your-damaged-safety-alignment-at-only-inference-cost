<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 560">
  <style>
    text { font-family: 'Times New Roman', 'DejaVu Serif', serif; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; font-weight: 400; }
    .t  { font-size: 14px; font-weight: 400; }
    .leader { stroke: #999; stroke-width: 0.5; stroke-dasharray: 3 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Training phase pill -->
  <rect x="40" y="30" width="280" height="40" rx="20" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.5"/>
  <text class="th" x="180" y="52" text-anchor="middle" dominant-baseline="central" fill="#26215C">Training phase (one-time offline)</text>

  <!-- Training container -->
  <rect x="40" y="88" width="600" height="224" rx="14" fill="#EEEDFE" stroke="#CECBF6" stroke-width="0.5"/>

  <!-- Collect pairs column -->
  <rect x="60" y="106" width="120" height="40" rx="8" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <text class="th" x="120" y="128" text-anchor="middle" dominant-baseline="central" fill="#042C53">Aligned LLM</text>
  <line x1="120" y1="146" x2="120" y2="168" stroke="#378ADD" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="64" y="174" width="116" height="30" rx="7" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.3" opacity="0.5"/>
  <rect x="60" y="178" width="120" height="30" rx="7" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
  <text class="th" x="120" y="195" text-anchor="middle" dominant-baseline="central" fill="#042C53">FT models</text>
  <line x1="120" y1="208" x2="120" y2="228" stroke="#378ADD" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="64" y="234" width="116" height="30" rx="7" fill="#F5C4B3" stroke="#D85A30" stroke-width="0.3" opacity="0.5"/>
  <rect x="60" y="238" width="120" height="30" rx="7" fill="#F5C4B3" stroke="#D85A30" stroke-width="0.5"/>
  <text class="th" x="120" y="255" text-anchor="middle" dominant-baseline="central" fill="#4A1B0C">Safety heads</text>

  <!-- Cross-phase dashed arrows -->
  <line x1="180" y1="193" x2="216" y2="193" stroke="#534AB7" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <line x1="180" y1="253" x2="216" y2="253" stroke="#D85A30" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>

  <!-- Hypernetwork training column -->
  <rect x="220" y="106" width="164" height="44" rx="8" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
  <text class="th" x="302" y="122" text-anchor="middle" dominant-baseline="central" fill="#412402">Activation fingerprint</text>
  <text class="ts" x="302" y="140" text-anchor="middle" dominant-baseline="central" fill="#854F0B">Layer-wise vectors</text>

  <line x1="302" y1="150" x2="274" y2="172" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="302" y1="150" x2="334" y2="172" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="232" y="174" width="78" height="34" rx="7" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text class="th" x="271" y="193" text-anchor="middle" dominant-baseline="central" fill="#633806">Direction</text>
  <rect x="316" y="174" width="78" height="34" rx="7" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text class="th" x="355" y="193" text-anchor="middle" dominant-baseline="central" fill="#633806">Magnitude</text>

  <line x1="271" y1="208" x2="302" y2="232" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="355" y1="208" x2="316" y2="232" stroke="#BA7517" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="230" y="234" width="158" height="50" rx="10" fill="#7F77DD" stroke="#534AB7" stroke-width="1"/>
  <text class="th" x="309" y="253" text-anchor="middle" dominant-baseline="central" fill="#EEEDFE">Hypernetwork G</text>
  <text class="ts" x="309" y="272" text-anchor="middle" dominant-baseline="central" fill="#CECBF6">Weight generation</text>

  <!-- Losses panel -->
  <rect x="430" y="106" width="196" height="180" rx="10" fill="#EEEDFE" stroke="#CECBF6" stroke-width="0.5"/>
  <text class="th" x="528" y="130" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Training losses</text>

  <text class="ts" x="528" y="158" text-anchor="middle" fill="#534AB7">L_recon</text>
  <text class="ts" x="528" y="176" text-anchor="middle" fill="#5F5E5A">Weight reconstruction</text>

  <text class="ts" x="528" y="204" text-anchor="middle" fill="#534AB7">L_cls</text>
  <text class="ts" x="528" y="222" text-anchor="middle" fill="#5F5E5A">Classifier accuracy</text>

  <text class="ts" x="528" y="250" text-anchor="middle" fill="#534AB7">L_func</text>
  <text class="ts" x="528" y="268" text-anchor="middle" fill="#5F5E5A">Behavioral on probes</text>

  <!-- Leader line from hypernetwork to losses -->
  <line class="leader" x1="388" y1="259" x2="428" y2="190"/>
  <circle cx="388" cy="259" r="2" fill="#534AB7"/>

  <!-- Feedback arrow -->
  <path d="M528 286 Q528 310 388 300 L388 284" fill="none" stroke="#7F77DD" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="ts" x="480" y="306" text-anchor="start" fill="#534AB7">Update G</text>

  <!-- Speed banner -->
  <rect x="140" y="340" width="400" height="44" rx="22" fill="#534AB7" stroke="#3C3489" stroke-width="0.5"/>
  <text class="th" x="340" y="356" text-anchor="middle" dominant-baseline="central" fill="#EEEDFE">Inference: deploy in ~10 seconds</text>
  <text class="ts" x="340" y="374" text-anchor="middle" dominant-baseline="central" fill="#CECBF6">No training, no gradients, no safety data needed</text>

  <!-- Inference container -->
  <rect x="40" y="408" width="600" height="134" rx="14" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.5"/>

  <!-- Inference flow -->
  <rect x="60" y="430" width="106" height="44" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th" x="113" y="446" text-anchor="middle" dominant-baseline="central" fill="#04342C">New model</text>
  <text class="ts" x="113" y="464" text-anchor="middle" dominant-baseline="central" fill="#085041">Unseen</text>

  <line x1="166" y1="452" x2="194" y2="452" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="196" y="434" width="100" height="36" rx="8" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th" x="246" y="448" text-anchor="middle" dominant-baseline="central" fill="#04342C">Extract</text>
  <text class="ts" x="246" y="464" text-anchor="middle" dominant-baseline="central" fill="#085041">Activations</text>

  <line x1="296" y1="452" x2="322" y2="452" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="324" y="434" width="96" height="36" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text class="th" x="372" y="448" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Hyper G</text>
  <text class="ts" x="372" y="464" text-anchor="middle" dominant-baseline="central" fill="#534AB7">Frozen</text>

  <line x1="420" y1="452" x2="446" y2="452" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="448" y="434" width="100" height="36" rx="8" fill="#F5C4B3" stroke="#D85A30" stroke-width="0.5"/>
  <text class="th" x="498" y="454" text-anchor="middle" dominant-baseline="central" fill="#4A1B0C">Safety head</text>

  <line x1="548" y1="452" x2="572" y2="452" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="574" y="434" width="52" height="36" rx="8" fill="#FAC775" stroke="#BA7517" stroke-width="0.5"/>
  <text class="th" x="600" y="454" text-anchor="middle" dominant-baseline="central" fill="#412402">Route</text>

  <!-- Routing arrows -->
  <path d="M584 470 Q568 494 556 502" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M616 470 Q632 494 638 502" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="504" y="506" width="86" height="26" rx="6" fill="#9FE1CB" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="ts" x="547" y="521" text-anchor="middle" dominant-baseline="central" fill="#04342C">Safe output</text>
  <rect x="608" y="506" width="52" height="26" rx="6" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
  <text class="ts" x="634" y="521" text-anchor="middle" dominant-baseline="central" fill="#501313">Refuse</text>
</svg>
